name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Configure test graph
        run: cmake -S . -B build
      - name: Lint
        run: cmake --build build --target lint
      - name: Type check
        run: cmake --build build --target typecheck
      - name: Test
        run: ctest --test-dir build --output-on-failure
